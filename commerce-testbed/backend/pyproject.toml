[project]
name = "commerce-testbed"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "bcrypt==5.0.0",
    "pyjwt>=2.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "pg8000>=1.31",
]

[project.optional-dependencies]
local = ["uvicorn[standard]>=0.29", "httpx>=0.27", "pytest>=8.0", "psycopg[binary]==3.3.5"]

[dependency-groups]
dev = [
    "psycopg[binary]==3.3.5",
    "httpx>=0.27",
    "pytest>=8.0",
    "uvicorn[standard]>=0.29",
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
